<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — TrafficVision</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><div id="toast-container"></div><main class="auth-card"><h1 class="auth-title">Reset password</h1><p class="auth-subtitle">Verify with the Google Authenticator code currently linked to your account.</p><form id="reset-form"><div class="form-group"><label class="form-label" for="email">Account email</label><input class="form-input" id="email" type="email" required autocomplete="email"></div><div class="form-group"><label class="form-label" for="otp">6-digit authenticator code</label><input class="form-input" id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><div class="form-group"><label class="form-label" for="password">New password</label><input class="form-input" id="password" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn btn-primary btn-full" type="submit">Reset password</button></form><p class="text-sm text-muted" style="margin-top:20px"><a href="index.html">Back to login</a></p></main><script type="module">import {apiFetch,showToast} from './js/utils.js';
document.getElementById('reset-form').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget;try{await apiFetch('/auth/reset-password',{method:'POST',body:{email:f.email.value,otp:f.otp.value,new_password:f.password.value}});showToast('Password reset. Please sign in again.','success');setTimeout(()=>location.href='index.html',700);}catch(err){showToast(err.message||'Password reset failed','error');}});
</script></body></html>
