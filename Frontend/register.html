<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT303 - Real-Time Traffic Sign Recognition System</title>
  <meta name="description" content="Create your account for IT303 - Real-Time Traffic Sign Recognition System." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="css/style.css?v=20261012" />
</head>
<body class="auth-page">
  <div id="toast-container"></div>

  <div class="auth-card" style="max-width:520px">
    <div class="auth-logo">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" style="color:var(--accent)">
        <circle cx="18" cy="18" r="18" fill="var(--accent-subtle)"/>
        <polygon points="18,6 30,27 6,27" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="18" cy="22" r="2" fill="currentColor"/>
        <rect x="17" y="13" width="2" height="6" rx="1" fill="currentColor"/>
      </svg>
      <div class="auth-logo-text">IT303 - <span>Real-Time Traffic Sign Recognition</span></div>
    </div>

    <div style="text-align:center;margin-bottom:var(--space-4)">
      <span class="badge badge-cyan" style="font-size:0.8rem">IT303: Software Engineering</span>
    </div>

    <div id="alert-box" class="alert alert-danger hidden" role="alert">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="alert-msg"></span>
    </div>

    <form id="register-form" novalidate>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="form-input-group">
            <svg class="input-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="username" type="text" class="form-input" placeholder="johndoe" minlength="3" required autocomplete="username" />
          </div>
          <div class="form-error" id="err-username">Min 3 characters.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="form-input-group">
            <svg class="input-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input id="email" type="email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-error" id="err-email">Enter a valid email.</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="form-input-group">
          <svg class="input-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="password" type="password" class="form-input" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="form-error" id="err-password">Min 8 characters.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirm Password</label>
        <div class="form-input-group">
          <svg class="input-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="confirm-password" type="password" class="form-input" placeholder="Repeat password" required autocomplete="new-password" />
        </div>
        <div class="form-error" id="err-confirm">Passwords do not match.</div>
      </div>

      <!-- Password strength bar -->
      <div style="margin-bottom:var(--space-5)">
        <div class="progress-bar-wrap">
          <div id="strength-bar" class="progress-bar-fill" style="width:0%;background:var(--danger);transition:width .3s,background .3s"></div>
        </div>
        <span id="strength-label" class="text-xs text-muted">Password strength</span>
      </div>

      <button id="reg-btn" type="submit" class="btn btn-primary btn-full btn-lg">
        Create Account
      </button>
    </form>

    <div class="divider">or</div>
    <p class="text-center text-sm" style="color:var(--text-secondary)">
      Already have an account? <a href="index.html" style="font-weight:600">Sign in</a>
    </p>
  </div>

  <script type="module">
    import { apiFetch, showToast, redirectIfLoggedIn } from './js/utils.js';
    redirectIfLoggedIn();

    const pwdEl  = document.getElementById('password');
    const barEl  = document.getElementById('strength-bar');
    const lblEl  = document.getElementById('strength-label');

    pwdEl.addEventListener('input', () => {
      const v = pwdEl.value;
      let score = 0;
      if (v.length >= 8)  score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
      const colors = ['', 'var(--danger)', 'var(--amber)', 'hsl(60,80%,50%)', 'var(--success)'];
      barEl.style.width   = `${score * 25}%`;
      barEl.style.background = colors[score] || 'var(--border)';
      lblEl.textContent = labels[score] || 'Password strength';
      lblEl.style.color = colors[score] || 'var(--text-muted)';
    });

    const form   = document.getElementById('register-form');
    const btn    = document.getElementById('reg-btn');
    const alertEl= document.getElementById('alert-box');
    const alertMg= document.getElementById('alert-msg');

    function showError(msg) {
      alertEl.classList.remove('hidden');
      alertMg.textContent = msg;
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      alertEl.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const email    = document.getElementById('email').value.trim().toLowerCase();
      const password = pwdEl.value;
      const confirm  = document.getElementById('confirm-password').value;

      if (username.length < 3) { showError('Username must be at least 3 characters.'); return; }
      if (!email.includes('@')) { showError('Enter a valid email address.'); return; }
      if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
      if (password !== confirm) { showError('Passwords do not match.'); return; }

      btn.classList.add('btn-loading'); btn.disabled = true;
      try {
        await apiFetch('/auth/register', { method: 'POST', body: { username, email, password } });
        showToast('Account created! Please sign in.', 'success');
        setTimeout(() => window.location.href = 'index.html', 1200);
      } catch (err) {
        showError(err.message || 'Registration failed.');
      } finally {
        btn.classList.remove('btn-loading'); btn.disabled = false;
      }
    });
  </script>
</body>
</html>
